<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprite-Stack Jet — no 3D engine</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace}
  canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;cursor:crosshair}
  #hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#e8f4ff;font-size:11px;letter-spacing:2px;text-transform:uppercase;pointer-events:none;text-shadow:0 1px 0 #000,0 0 6px #000;opacity:.85}
  #alt{position:absolute;left:12px;top:10px;color:#e8f4ff;font-size:11px;letter-spacing:1px;pointer-events:none;text-shadow:0 1px 0 #000,0 0 6px #000;opacity:.8}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9cc8ff;font-size:13px;letter-spacing:3px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="alt"></div>
<div id="hint"></div>
<div id="loading">GENERATING ISLANDS…</div>
<script>
'use strict';
/* =====================================================================
   SPRITE-STACK JET v2 — pure Canvas 2D. No WebGL, no polygons, no 3D lib.

   OVERHEAD VIEW  – the camera never rotates (north is always up), so every
     static sprite stack (terrain terraces, trees, clouds) can be BAKED once
     into a bitmap: layer L is drawn L pixels higher than layer L-1. Only
     the jet is stacked live every frame, because it turns and rolls.
   ALTITUDE       – things at height h are scaled by s = Z·F / (F + alt − h).
   COCKPIT VIEW   – a Mode 7 floor: each screen row below the horizon is a
     line on the ground at distance d = camHeight·focal / (row − horizon),
     sampled from a flat colour map. Clouds are distance-scaled billboards.
     The cockpit and its instruments are drawn with plain rects and arcs.
   ===================================================================== */

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hintEl = document.getElementById('hint'), altEl = document.getElementById('alt');

// ---------- helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const wrapPi = a => { a = (a + Math.PI) % (2 * Math.PI); if (a < 0) a += 2 * Math.PI; return a - Math.PI; };
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(x, y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
const pack = (c, m = 1) => (255 << 24) | (Math.min(255, c[2] * m) << 16) | (Math.min(255, c[1] * m) << 8) | Math.min(255, c[0] * m);
const rgb = (c, a = 1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

// ---------- constants ----------
const WS = 1536, NPX = WS * WS;     // world wraps every WS units
const NL = 14;                      // terrain levels
const F = 2000, Z = 1.6;            // perspective: s = Z*F/(F + alt - h)
const PR = 2000;                    // planet radius for the view from space
const MAX_ALT = 60000, MIN_ALT = 15;
const SUN = [-0.13, 0.22];          // shadow direction per unit of height
const K7 = 0.12;                    // cockpit: vertical scale of altitude
const JS = 1.3;                     // jet: screen pixels per voxel

// ---------- screen ----------
let W = 570, H = 320, CX, CY;
const m7 = document.createElement('canvas'), m7c = m7.getContext('2d');
const ov = document.createElement('canvas'), ovc = ov.getContext('2d');
let m7img, m7buf, CK = {};
function resize(){
  H = 320; W = clamp(Math.round(H * innerWidth / innerHeight), 260, 760);
  cv.width = W; cv.height = H; m7.width = W; m7.height = H;
  m7img = m7c.createImageData(W, H); m7buf = new Uint32Array(m7img.data.buffer);
  CX = W / 2; CY = H / 2;
  buildCockpit();
}

/* =====================================================================
   1. WORLD: tileable fbm height -> levels -> two maps
      flat32  : plain colour map (cockpit Mode 7 + radar)
      over32  : same map with every terrain layer & tree BAKED as a stack
   ===================================================================== */
const rnd = mulberry32(20261116);
let lvl, flat32, overheadPattern, sea;
const OCEAN = [[104,200,240],[74,158,230],[54,124,210],[44,104,194],[36,86,172]];
const LAND = [null,[238,222,162],[166,224,92],[150,214,80],[136,206,72],[118,196,64],[102,184,58],[90,172,54],[78,156,50],[66,142,48],
              [140,132,120],[126,118,108],[152,146,134],[170,164,152],[190,184,174]];
const TREE = [[26,82,38],[34,100,42],[46,120,48],[62,140,56],[86,164,66]];

function fbm(periods, gain){
  const out = new Float32Array(NPX); let amp = 1, tot = 0;
  for (const p of periods){
    const lat = new Float32Array(p * p); for (let i = 0; i < lat.length; i++) lat[i] = rnd();
    const cell = WS / p;
    for (let y = 0; y < WS; y++){
      const fy = y / cell, iy = fy | 0, ty = fy - iy, sy = ty * ty * (3 - 2 * ty), y0 = (iy % p) * p, y1 = ((iy + 1) % p) * p;
      for (let x = 0; x < WS; x++){
        const fx = x / cell, ix = fx | 0, tx = fx - ix, sx = tx * tx * (3 - 2 * tx), x0 = ix % p, x1 = (ix + 1) % p;
        const a = lat[y0 + x0], b = lat[y0 + x1], c = lat[y1 + x0], d = lat[y1 + x1];
        const top = a + (b - a) * sx, bot = c + (d - c) * sx;
        out[y * WS + x] += amp * (top + (bot - top) * sy);
      }
    }
    tot += amp; amp *= gain;
  }
  for (let i = 0; i < NPX; i++) out[i] /= tot;
  return out;
}
const idx = (x, y) => (((y % WS) + WS) % WS) * WS + (((x % WS) + WS) % WS);

function buildWorld(){
  const h = fbm([6, 12, 24, 48, 96, 192], 0.5);
  const forest = fbm([24, 48], 0.6);
  // pick sea level so ~24% is land
  const sample = []; for (let i = 0; i < 40000; i++) sample.push(h[(rnd() * NPX) | 0]);
  sample.sort((a, b) => a - b);
  sea = sample[(sample.length * 0.76) | 0];
  const hTop = sample[(sample.length * 0.9995) | 0], hLow = sample[(sample.length * 0.02) | 0];

  lvl = new Uint8Array(NPX);
  const depth = new Float32Array(NPX);
  for (let i = 0; i < NPX; i++){
    if (h[i] >= sea) lvl[i] = clamp(1 + Math.floor((h[i] - sea) / (hTop - sea) * NL), 1, NL);
    else depth[i] = (sea - h[i]) / (sea - hLow);
  }

  flat32 = new Uint32Array(NPX);
  const over = new Uint32Array(NPX);
  // ocean: depth bands, wave streaks, surf
  for (let y = 0; y < WS; y++) for (let x = 0; x < WS; x++){
    const i = y * WS + x; if (lvl[i]) continue;
    const n = hash(x, y), d = depth[i] + (n - 0.5) * 0.03;
    const band = d < 0.035 ? 0 : d < 0.09 ? 1 : d < 0.2 ? 2 : d < 0.42 ? 3 : 4;
    let c = pack(OCEAN[band], 0.97 + 0.05 * n);
    const near1 = lvl[idx(x+1,y)] || lvl[idx(x-1,y)] || lvl[idx(x,y+1)] || lvl[idx(x,y-1)];
    const near2 = !near1 && (lvl[idx(x+2,y)] || lvl[idx(x-2,y)] || lvl[idx(x,y+2)] || lvl[idx(x,y-2)]);
    if (near1 && n > 0.2) c = pack([242, 249, 255]);
    else if (near2 && n > 0.45) c = pack([196, 232, 252]);
    flat32[i] = over[i] = c;
  }
  for (let y = 0; y < WS; y++) for (let x = 0; x < WS; x++){         // vertical white wave streaks
    const i = y * WS + x;
    if (lvl[i] || depth[i] < 0.04 || hash(x * 3 + 1, y * 7 + 5) > 0.011) continue;
    const c = pack(hash(x, y + 9) > 0.5 ? [236, 246, 255] : [190, 222, 250]);
    for (let k = 0; k < 3; k++){ const j = idx(x, y + k); if (!lvl[j]) flat32[j] = over[j] = c; }
  }
  // flat land (contour line wherever a neighbour is a level lower)
  for (let y = 0; y < WS; y++) for (let x = 0; x < WS; x++){
    const i = y * WS + x, L = lvl[i]; if (!L) continue;
    const edge = lvl[idx(x+1,y)] < L || lvl[idx(x-1,y)] < L || lvl[idx(x,y+1)] < L || lvl[idx(x,y-1)] < L;
    flat32[i] = pack(LAND[L], edge ? 0.76 : 0.95 + 0.07 * hash(x, y));
  }
  // BAKED STACK: draw layer 1..NL, each shifted up (L-1) px; south-facing cliffs darker
  for (let L = 1; L <= NL; L++){
    const off = L - 1, col = LAND[L];
    for (let y = 0; y < WS; y++){
      const ty = ((y - off) % WS + WS) % WS;
      for (let x = 0; x < WS; x++){
        const i = y * WS + x; if (lvl[i] < L) continue;
        const south = lvl[idx(x, y + 1)] < L;
        const edge = south || lvl[idx(x+1,y)] < L || lvl[idx(x-1,y)] < L || lvl[idx(x,y-1)] < L;
        over[ty * WS + x] = pack(col, south ? 0.62 : edge ? 0.76 : 0.95 + 0.07 * hash(x, y));
      }
    }
  }
  // trees: a tiny 5-layer stack, baked in row order so nearer trees overlap farther ones
  const treeR = [2.2, 3.3, 3.2, 2.6, 1.6], tree = [];
  for (let k = 0; k < 5; k++){
    const cy = 7 - k;
    for (let py = 0; py < 11; py++) for (let px = 0; px < 7; px++){
      const dx = px - 3, dy = py - cy;
      if (dx * dx + dy * dy <= treeR[k] * treeR[k]){
        const r2 = treeR[k] - 0.9, edge = dx * dx + dy * dy > r2 * r2;
        tree.push([px, py, pack(TREE[k], edge ? 0.8 : 1 + (dx < 0 && dy < 0 ? 0.12 : 0))]);
      }
    }
  }
  for (let gy = 0; gy < WS; gy += 5) for (let gx = 0; gx < WS; gx += 5){
    const x = gx + ((hash(gx, gy) * 4) | 0), y = gy + ((hash(gy, gx) * 4) | 0), i = idx(x, y), L = lvl[i];
    if (L < 2 || L > 9 || forest[i] < 0.56 || hash(x + 3, y) < 0.3) continue;
    for (const [px, py, c] of tree) over[idx(x - 3 + px, y - 9 - (L - 1) + py)] = c;
    for (let k = 0; k < 4; k++) flat32[idx(x + (k & 1), y + (k >> 1))] = pack(TREE[1 + (k === 0 ? 2 : 0)]);
  }
  const oc = document.createElement('canvas'); oc.width = oc.height = WS;
  const og = oc.getContext('2d'), oimg = og.createImageData(WS, WS);
  new Uint32Array(oimg.data.buffer).set(over); og.putImageData(oimg, 0, 0);
  overheadPattern = ctx.createPattern(oc, 'repeat');
}
const lvlAt = (x, y) => lvl[idx(Math.floor(x), Math.floor(y))];

/* =====================================================================
   2. CLOUDS: union of spheres -> baked top-down stack + shadow + side billboard
   ===================================================================== */
const clouds = [];
function buildClouds(){
  for (let n = 0; n < 120; n++){
    const sp = [], cnt = 3 + ((rnd() * 5) | 0), ax = rnd() * Math.PI;
    for (let j = 0; j < cnt; j++){
      const t = cnt === 1 ? 0 : j / (cnt - 1) - 0.5, r = 7 + rnd() * 13 * (1 - Math.abs(t));
      sp.push({ x: Math.cos(ax) * t * cnt * 9 + (rnd() - 0.5) * 8, y: Math.sin(ax) * t * cnt * 9 + (rnd() - 0.5) * 8, r, z: r * 0.55 });
    }
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, zm = 0;
    for (const s of sp){ x0 = Math.min(x0, s.x - s.r); x1 = Math.max(x1, s.x + s.r); y0 = Math.min(y0, s.y - s.r); y1 = Math.max(y1, s.y + s.r); zm = Math.max(zm, s.z + s.r); }
    x0 = Math.floor(x0) - 1; y0 = Math.floor(y0) - 1; zm = Math.ceil(zm);
    const w = Math.ceil(x1) - x0 + 2, h = Math.ceil(y1) - y0 + 2;
    // per pixel z-range of the cloud column
    const zlo = new Float32Array(w * h).fill(1e9), zhi = new Float32Array(w * h).fill(-1);
    for (let py = 0; py < h; py++) for (let px = 0; px < w; px++){
      for (const s of sp){
        const dx = px + x0 - s.x, dy = py + y0 - s.y, d2 = dx * dx + dy * dy;
        if (d2 < s.r * s.r){ const e = Math.sqrt(s.r * s.r - d2); const k = py * w + px;
          zlo[k] = Math.min(zlo[k], Math.max(0, s.z - e)); zhi[k] = Math.max(zhi[k], s.z + e); }
      }
    }
    const inside = (px, py, z) => px >= 0 && py >= 0 && px < w && py < h && z >= zlo[py * w + px] && z <= zhi[py * w + px];
    const top = document.createElement('canvas'); top.width = w; top.height = h + zm;
    const tg = top.getContext('2d'), ti = tg.createImageData(w, h + zm), tb = new Uint32Array(ti.data.buffer);
    const shadow = document.createElement('canvas'); shadow.width = w; shadow.height = h;
    const sg = shadow.getContext('2d'); sg.fillStyle = 'rgb(12,34,96)';
    for (let z = 0; z <= zm; z++){
      const t = Math.pow(z / zm, 0.7), col = mixc([164, 188, 222], [255, 255, 255], t);
      for (let py = 0; py < h; py++) for (let px = 0; px < w; px++){
        if (!inside(px, py, z)) continue;
        const edge = !inside(px+1,py,z) || !inside(px-1,py,z) || !inside(px,py+1,z) || !inside(px,py-1,z);
        tb[(py + zm - z) * w + px] = pack(col, edge ? 0.9 : 1);
      }
    }
    tg.putImageData(ti, 0, 0);
    for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) if (zhi[py * w + px] >= 0) sg.fillRect(px, py, 1, 1);
    // side billboard for the cockpit
    const bb = document.createElement('canvas'); bb.width = w; bb.height = zm + 2;
    const bg = bb.getContext('2d'), bi = bg.createImageData(w, zm + 2), bbuf = new Uint32Array(bi.data.buffer);
    const side = (u, v) => sp.some(s => { const dx = u + x0 - s.x, dz = v - s.z; return dx * dx + dz * dz < s.r * s.r && v >= 0; });
    for (let v = 0; v <= zm; v++) for (let u = 0; u < w; u++){
      if (!side(u, v)) continue;
      const edge = !side(u, v + 1) || !side(u + 1, v) || !side(u - 1, v);
      bbuf[(zm - v + 1) * w + u] = pack(mixc([170, 192, 224], [255, 255, 255], Math.pow(v / zm, 0.6)), edge ? 0.92 : 1);
    }
    bg.putImageData(bi, 0, 0);
    clouds.push({ x: rnd() * WS, y: rnd() * WS, h: 650 + rnd() * 380, x0, y0, w, hh: h, zm, top, shadow, bb });
  }
}

/* =====================================================================
   3. THE JET: a voxel function sliced into 8 layers, stacked live
   ===================================================================== */
const GM = [58, 62, 72], GM2 = [84, 90, 102], DK = [36, 38, 44], OR = [226, 88, 44], CYAN = [92, 218, 238];
function jetVox(x, y, z){
  const ax = Math.abs(x);
  if (y >= 11 && y <= 12 && ax >= 1 && ax <= 2 && z >= 2 && z <= 3) return [28, 28, 32];        // twin nozzles
  const bw = y < -10 ? 0 : y < -7 ? 1 : y < -1 ? 2 : y <= 10 ? 3 : -1;                           // fuselage
  const zlo = y < -10 ? 2 : 1, zhi = y < -10 ? 3 : 4;
  if (bw >= 0 && ax <= bw && z >= zlo && z <= zhi) return y <= -12 ? DK : z === zhi && ax <= 1 ? GM2 : GM;
  if (z >= 2 && z <= 3 && ax === 3 && y >= -6 && y <= -2) return OR;                              // intakes
  if (z === 5 && y >= -9 && y <= -4 && ax <= 1 && !(ax === 1 && (y === -9 || y === -4))) return CYAN; // canopy
  if (z === 2 && y >= -4 && y <= 7){ const span = 3 + (y + 4) * 0.75;                             // delta wing
    if (ax <= span) return ax >= span - 1.2 ? OR : ax > 8 ? GM2 : GM; }
  if (z === 2 && y >= 8 && y <= 12 && ax >= 4 && ax <= 3 + (y - 7) * 1.1) return GM2;              // tailplanes
  if (ax === 3 && z >= 5 && z <= 7 && y >= 4 + (z - 4) && y <= 10) return z === 7 ? OR : GM2;      // twin fins
  return null;
}
const JZ = 8, JW = 23, JH = 27, jetLayers = [];
const jetSil = document.createElement('canvas'); jetSil.width = JW; jetSil.height = JH;
const jetSilG = document.createElement('canvas'); jetSilG.width = JW; jetSilG.height = JH;
(function buildJet(){
  const sg = jetSil.getContext('2d'), gg = jetSilG.getContext('2d');
  sg.fillStyle = 'rgb(12,34,96)'; gg.fillStyle = '#7dff9a';
  for (let z = 0; z < JZ; z++){
    const c = document.createElement('canvas'); c.width = JW; c.height = JH;
    const g = c.getContext('2d'), id = g.createImageData(JW, JH), b = new Uint32Array(id.data.buffer);
    for (let y = -13; y <= 13; y++) for (let x = -11; x <= 11; x++){
      const col = jetVox(x, y, z); if (!col) continue;
      const edge = !jetVox(x+1,y,z) || !jetVox(x-1,y,z) || !jetVox(x,y+1,z) || !jetVox(x,y-1,z);
      b[(y + 13) * JW + (x + 11)] = pack(col, (edge ? 0.75 : 1) * (0.78 + 0.32 * z / (JZ - 1)));
      sg.fillRect(x + 11, y + 13, 1, 1); gg.fillRect(x + 11, y + 13, 1, 1);
    }
    g.putImageData(id, 0, 0); jetLayers.push(c);
  }
})();

// ---------- state & input ----------
const S = { x: 0, y: 0, alt: 1300, vz: 0, speed: 120, a: 0.6, turn: 0, bank: 0, pitch: 0,
  rollT: 0, rollDir: 1, view: 'overhead', t: 0, camX: 0, camY: 0, thrust: false };
const trailL = [], trailR = [], stars = [];
for (let i = 0; i < 320; i++) stars.push({ az: rnd() * Math.PI * 2, el: Math.asin(rnd()) * 1.3, u: rnd(), v: rnd(), b: 0.35 + rnd() * 0.65 });
const keys = {};
let px = 0, py = 0, pActive = false, down = false, downT = 0;
addEventListener('keydown', e => {
  if (keys[e.code]) return; keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'KeyC'){ e.preventDefault(); S.view = S.view === 'overhead' ? 'cockpit' : 'overhead'; }
  if (e.code === 'KeyR' || e.code === 'KeyQ') startRoll();
});
addEventListener('keyup', e => keys[e.code] = false);
cv.addEventListener('pointerdown', e => { down = true; downT = performance.now(); setP(e); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', setP);
cv.addEventListener('pointerup', () => { if (down && performance.now() - downT < 180) startRoll(); down = false; });
cv.addEventListener('pointercancel', () => down = false);
function setP(e){ const r = cv.getBoundingClientRect(); px = (e.clientX - r.left) / r.width * W; py = (e.clientY - r.top) / r.height * H; pActive = true; }
function startRoll(){ if (S.rollT <= 0){ S.rollT = 0.0001; S.rollDir = S.turn >= 0 ? 1 : -1; } }
const groundH = (x, y) => { const L = lvlAt(x, y); return L ? L * 8 : 0; };

// ---------- update ----------
function update(dt){
  S.t += dt;
  const fwd = [Math.sin(S.a), -Math.cos(S.a)];
  // steering
  let steer = 0, climb = 0;
  if (S.view === 'overhead'){
    if (pActive){
      const jx = CX + (S.x - S.camX) * Z, jy = CY + (S.y - S.camY) * Z;   // jet on screen
      const dx = px - jx, dy = py - jy;
      if (dx * dx + dy * dy > 400) steer = clamp(wrapPi(Math.atan2(dx, -dy) - S.a) * 1.6, -1, 1);
    }
    climb = S.thrust ? 0.8 : clamp((1300 - S.alt) / 1500, -0.25, 0.25);   // idle: drift back to cruise
  } else if (pActive){
    const nx = px / W * 2 - 1, ny = py / H * 2 - 1;
    steer = Math.abs(nx) < 0.05 ? 0 : clamp(nx * 1.3, -1, 1);
    climb = Math.abs(ny) < 0.06 ? 0 : clamp(-ny * 1.4, -1, 1);
  }
  if (keys.ArrowLeft || keys.KeyA) steer = -1;
  if (keys.ArrowRight || keys.KeyD) steer = 1;
  if (keys.ArrowUp || keys.KeyW) climb = 1;
  if (keys.ArrowDown || keys.KeyS) climb = -1;

  S.turn = lerp(S.turn, steer, Math.min(1, dt * 4));
  S.a += S.turn * 1.6 * dt;
  S.bank = lerp(S.bank, S.turn * 0.8, Math.min(1, dt * 5));

  S.thrust = keys.ShiftLeft || keys.ShiftRight || (down && performance.now() - downT >= 180);
  S.speed = lerp(S.speed, S.thrust ? 240 : 120, Math.min(1, dt * 1.4));
  const rate = 260 + S.alt * 0.5;
  S.vz = lerp(S.vz, climb * rate, Math.min(1, dt * 2));
  S.pitch = lerp(S.pitch, clamp(S.vz / rate, -1, 1) * 0.45, Math.min(1, dt * 4));
  S.alt = clamp(S.alt + S.vz * dt, MIN_ALT, MAX_ALT);
  const floor = groundH(S.x, S.y) + MIN_ALT;
  if (S.alt < floor){ S.alt = lerp(S.alt, floor, 0.3); S.vz = Math.max(0, S.vz); }

  S.x += fwd[0] * S.speed * dt; S.y += fwd[1] * S.speed * dt;
  S.camX = lerp(S.camX, S.x + fwd[0] * S.speed * 0.35, Math.min(1, dt * 3));
  S.camY = lerp(S.camY, S.y + fwd[1] * S.speed * 0.35, Math.min(1, dt * 3));

  if (S.rollT > 0){ S.rollT += dt / 0.8; if (S.rollT >= 1) S.rollT = 0; }
  const e = S.rollT > 0 ? (1 - Math.cos(S.rollT * Math.PI)) / 2 : 0;
  S.roll = S.bank + e * Math.PI * 2 * S.rollDir;

  // wingtip contrails (world positions)

// ---------- overhead projection (camera north-up) ----------
const wrapD = d => { d %= WS; if (d > WS / 2) d -= WS; if (d < -WS / 2) d += WS; return d; };
function proj(wx, wy, h, wrap){
  let dx = wx - S.camX, dy = wy - S.camY;

  const depth = F + S.alt - h; if (depth < F * 0.12) return null;
  const s = Z * F / depth;
  return { x: CX + dx * s, y: CY + dy * s, s };
}

// ---------- the live sprite-stacked jet ----------
function drawJet(cx, cy, yaw, roll, sc, g = ctx){
  const cr = Math.cos(roll), sr = Math.sin(roll);
  const sx = Math.sign(cr || 1) * Math.max(0.14, Math.abs(cr));
  const LZ = 1.1 * sc, zc = 3, rx = Math.cos(yaw), ry = Math.sin(yaw);
  for (let k = 0; k < JZ; k++){
    const z = cr >= 0 ? k : JZ - 1 - k, o = (z - zc) * LZ;
    g.setTransform(1, 0, 0, 1, cx + rx * sr * o, cy + ry * sr * o - cr * o);
    g.rotate(yaw); g.scale(sx * sc, sc);
    g.drawImage(jetLayers[z], -JW / 2, -JH / 2);
    if (z === 2){                                    // twin flames from the nozzles
      const len = S.thrust ? 5 + Math.random() * 6 : 1.5 + Math.random() * 1.5;
      for (const fx of [-1.5, 1.5]){
        g.fillStyle = '#ff6a1f'; g.fillRect(fx - 1, 13, 2, len);
        g.fillStyle = '#ffd34a'; g.fillRect(fx - 0.5, 13, 1, len * 0.65);

    }
  }

    g.setTransform(1, 0, 0, 1, cx, cy); g.rotate(yaw);
    g.globalCompositeOperation = 'lighter';

    gr.addColorStop(0, 'rgba(255,170,60,0.55)'); gr.addColorStop(1, 'rgba(255,90,20,0)');
    g.fillStyle = gr; g.fillRect(-10 * sc, 6 * sc, 20 * sc, 20 * sc);
    g.globalCompositeOperation = 'source-over';
  }

}

function drawCloudsOverhead(test, alpha){
  ctx.globalAlpha = alpha;
  for (const c of clouds){
    if (!test(c.h)) continue;
    const p = proj(c.x, c.y, c.h, true); if (!p) continue;
    const x = p.x + c.x0 * p.s, y = p.y + (c.y0 - c.zm) * p.s, w = c.w * p.s, h = (c.hh + c.zm) * p.s;

}

/* =====================================================================
   OVERHEAD VIEW
   ===================================================================== */
function renderOverhead(){
  const sG = Z * F / (F + S.alt), diag = Math.hypot(W, H) / 2, planetR = PR * sG, space = planetR < diag * 1.3;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#02030a'; ctx.fillRect(0, 0, W, H);
  if (space){
    for (const st of stars){ ctx.fillStyle = `rgba(255,255,255,${st.b})`; ctx.fillRect((st.u * W) | 0, (st.v * H) | 0, 1, 1); }
    ctx.save(); ctx.beginPath(); ctx.arc(CX, CY, planetR, 0, 7); ctx.clip();
  }

  ctx.imageSmoothingEnabled = sG < 0.8;

  ctx.fillStyle = overheadPattern;

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;

    for (let gx = Math.floor((S.camX - R) / step); gx <= (S.camX + R) / step; gx++)
      for (let gy = Math.floor((S.camY - R) / step); gy <= (S.camY + R) / step; gy++){
        const r1 = hash(gx, gy); if (Math.sin(S.t * 2.2 + r1 * 50) < 0.93) continue;

      }

      const x = p.x + c.x0 * p.s, y = p.y + c.y0 * p.s;

    if (p){

      ctx.drawImage(jetSil, -JW / 2, -JH / 2); ctx.setTransform(1, 0, 0, 1, 0, 0);
    }
    ctx.globalAlpha = 1;
  }
  const haze = smooth(3000, 40000, S.alt) * 0.25;
  if (haze > 0){ ctx.fillStyle = `rgba(165,200,255,${haze})`; ctx.fillRect(0, 0, W, H); }
  if (space){
    const g = ctx.createRadialGradient(CX, CY, planetR * 0.55, CX, CY, planetR);
    g.addColorStop(0, 'rgba(0,0,20,0)'); g.addColorStop(1, 'rgba(0,0,20,0.65)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
    const a = ctx.createRadialGradient(CX, CY, planetR * 0.9, CX, CY, planetR * 1.09);
    a.addColorStop(0, 'rgba(120,185,255,0)'); a.addColorStop(0.55, 'rgba(120,185,255,0.75)'); a.addColorStop(1, 'rgba(120,185,255,0)');
    ctx.fillStyle = a; ctx.fillRect(0, 0, W, H);

  drawTrail(trailL); drawTrail(trailR);
  const jp = proj(S.x, S.y, S.alt, false);

  const fog = 1 - minD / 40; if (fog > 0){ ctx.fillStyle = `rgba(245,248,252,${fog * 0.7})`; ctx.fillRect(0, 0, W, H); }

}

const DAY_TOP = [70, 140, 228], DAY_HOR = [190, 226, 250], NIGHT_TOP = [4, 7, 22], NIGHT_HOR = [24, 34, 72];
function renderCockpit(){
  const space = smooth(15000, 50000, S.alt);
  const FOC = W * 0.6, hc = 10 + S.alt * K7;
  const hz = Math.round(H * 0.38 + Math.tan(S.pitch) * FOC + Math.min(30, Math.log1p(S.alt / 3000) * 8));

  let hor = mixc(mixc(NIGHT_HOR, DAY_HOR, S.day), [60, 110, 190], space * 0.6);
  hor = mixc(hor, [255, 160, 100], S.sunset * 0.55 * (1 - space));
  const buf = m7buf;
  for (let y = 0; y < Math.min(H, Math.max(0, hz + 1)); y++){
    buf.fill(pack(mixc(top, hor, Math.pow(clamp(y / Math.max(1, hz), 0, 1), 2.2))), y * W, y * W + W);
  }

    const d = hc * FOC / (y - hz);

      const c = flat32[(((wy | 0) % WS + WS) % WS) * WS + (((wx | 0) % WS + WS) % WS)];
      buf[i] = (255 << 24) | (((c >> 16 & 255) * light[2] * inv + hb * fog) << 16) | (((c >> 8 & 255) * light[1] * inv + hg * fog) << 8) | ((c & 255) * light[0] * inv + hr * fog);

}

  num(ctx, spd, hx + 6, hy + 8, G); const as = String(alt); num(ctx, as, hx + hw - 6 - as.length * 4, hy + 8, G);
  const hd = String(Math.round(((S.a * 180 / Math.PI) % 360 + 360) % 360)).padStart(3, '0');
  num(ctx, hd, CX - 6, hy + hh - 12, G);
  ctx.fillRect(CX - 40, hy + hh - 16, 80, 1);
  for (let k = -4; k <= 4; k++){ const x = CX + k * 10 - ((S.a * 180 / Math.PI) % 10 + 10) % 10; ctx.fillRect(x | 0, hy + hh - 19, 1, 3); }
  ctx.restore();
}

function drawInstruments(){
  const t = S.t;
  // radar: heading-up map from the level grid + sweep
  const r = CK.radar, rc = CK.radarC, rg = rc.getContext('2d'), rw = rc.width, rh = rc.height;
  const im = rg.createImageData(rw, rh), b = new Uint32Array(im.data.buffer);
  const range = 14, ca = Math.cos(S.a), sa = Math.sin(S.a);
  for (let y = 0; y < rh; y++) for (let x = 0; x < rw; x++){
    const lx = (x - rw / 2) * range, ly = (y - rh * 0.7) * range;
    const wx = S.x + lx * ca - ly * sa, wy = S.y + lx * sa + ly * ca;
    const L = lvlAt(wx, wy);
    b[y * rw + x] = L ? pack(L > 6 ? [110, 255, 140] : [60, 200, 90]) : pack([10, 28, 14]);
  }
  rg.putImageData(im, 0, 0);
  ctx.drawImage(rc, r.x, r.y, rw * 2, rh * 2);
  ctx.save(); ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
  const ox = r.x + r.w / 2, oy = r.y + r.h * 0.7;
  ctx.strokeStyle = 'rgba(125,255,154,0.35)'; ctx.lineWidth = 1;
  for (const rr of [r.h * 0.3, r.h * 0.6]){ ctx.beginPath(); ctx.arc(ox, oy, rr, 0, 7); ctx.stroke(); }
  const sw = t * 2.2; ctx.strokeStyle = 'rgba(180,255,200,0.9)';
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + Math.cos(sw) * r.w, oy + Math.sin(sw) * r.w); ctx.stroke();
  ctx.fillStyle = '#eaffef'; ctx.fillRect(ox - 1, oy - 1, 3, 3);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; for (let y = r.y; y < r.y + r.h; y += 2) ctx.fillRect(r.x, y, r.w, 1);
  ctx.restore();
  // attitude indicator
  const a = CK.adi;
  ctx.save(); ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 7); ctx.clip();
  ctx.translate(a.x, a.y); ctx.rotate(-S.roll); ctx.translate(0, S.pitch * a.r * 1.6);
  ctx.fillStyle = '#5e9ee6'; ctx.fillRect(-a.r * 2, -a.r * 3, a.r * 4, a.r * 3);
  ctx.fillStyle = '#9a6234'; ctx.fillRect(-a.r * 2, 0, a.r * 4, a.r * 3);
  ctx.fillStyle = '#fff'; ctx.fillRect(-a.r * 2, 0, a.r * 4, 1);
  for (let k = -3; k <= 3; k++) if (k) ctx.fillRect(-(k % 2 ? 6 : 10), -k * 8, k % 2 ? 12 : 20, 1);
  ctx.restore();
  ctx.fillStyle = '#ffcf3a'; ctx.fillRect(a.x - 14, a.y, 9, 2); ctx.fillRect(a.x + 6, a.y, 9, 2); ctx.fillRect(a.x - 1, a.y - 1, 3, 3);
  ctx.fillStyle = '#e3622a'; ctx.fillRect(a.x - 1, a.y - a.r - 4, 3, 3);
  // gauges: speed, thrust, climb, altitude
  const vals = [S.speed / 260, S.thrust ? 0.95 : 0.35, 0.5 + clamp(S.vz / 800, -0.5, 0.5), (S.alt % 1000) / 1000];
  CK.gauges.forEach((p, i) => {
    const ang = Math.PI * 0.75 + clamp(vals[i], 0, 1) * Math.PI * 1.5;
    ctx.strokeStyle = '#ff7a3a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(ang) * (p.r - 2), p.y + Math.sin(ang) * (p.r - 2)); ctx.stroke();
  });
  // throttle lamps
  for (let i = 0; i < 5; i++){ ctx.fillStyle = S.thrust || i < 2 ? '#ff8a2a' : '#5a2a14'; ctx.fillRect(CK.lamps.x + i * 11, CK.lamps.y, 9, 4); }
  // right MFD: jet icon + numbers + bars
  const m = CK.mfd, G = '#7dff9a';
  ctx.save(); ctx.beginPath(); ctx.rect(m.x, m.y, m.w, m.h); ctx.clip();
  num(ctx, Math.round(S.alt * 11), m.x + 5, m.y + 5, G);
  num(ctx, Math.round(S.speed * 3.2), m.x + 5, m.y + m.h - 10, G);
  ctx.setTransform(1, 0, 0, 1, m.x + m.w * 0.42, m.y + m.h * 0.55);
  const k = Math.min(1.4, m.h / 30); ctx.scale(k, k); ctx.drawImage(jetSilG, -JW / 2, -JH / 2);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (let i = 0; i < 2; i++){
    const bx = m.x + m.w - 18 + i * 8, v = i ? S.speed / 260 : clamp(S.alt / 20000, 0, 1);
    ctx.strokeStyle = G; ctx.strokeRect(bx + 0.5, m.y + 6.5, 5, m.h - 13);
    ctx.fillStyle = G; const fh = (m.h - 15) * v; ctx.fillRect(bx + 2, m.y + m.h - 8 - fh, 2, fh);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; for (let y = m.y; y < m.y + m.h; y += 2) ctx.fillRect(m.x, y, m.w, 1);
  ctx.restore();
}

// ---------- loop ----------
let last = 0, uiT = 0;
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
  update(dt);
  ctx.imageSmoothingEnabled = false;
  if (S.view === 'overhead') renderOverhead(); else renderCockpit();
  if ((uiT -= dt) <= 0){
    uiT = 0.15;
    hintEl.textContent = S.view === 'overhead'
      ? 'Move to steer · click to roll · hold to fire the thrusters · space for cockpit view'
      : 'Point to turn, climb and dive · click to roll · hold to fire the thrusters · space for overhead';
    altEl.textContent = S.view === 'overhead' ? `ALT ${Math.round(S.alt * 11)} FT` : '';
  }
  requestAnimationFrame(frame);
}
setTimeout(() => {
  buildWorld(); buildClouds(); resize(); addEventListener('resize', resize);
  // start just off the coast of the biggest nearby island
  let best = null;
  for (let i = 0; i < 4000 && !best; i++){
    const x = rnd() * WS, y = rnd() * WS;
    if (lvlAt(x, y) >= 6 && !lvlAt(x + 160, y + 220)) best = [x + 160, y + 220];
  }
  if (best){ S.x = best[0]; S.y = best[1]; }
  S.camX = S.x; S.camY = S.y; S.a = -0.5;
  document.getElementById('loading').remove();
  requestAnimationFrame(t => { last = t; frame(t); });
}, 30);
</script>
